name: Deploy pintu-frontend to VPS

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build Nuxt application
      run: npm run build
    
    - name: Create deployment archive
      run: |
        tar -czf output.tar.gz .output/
        ls -lh output.tar.gz
    
    - name: Upload .output to VPS
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        source: "output.tar.gz"
        target: "/var/www/pintu-frontend/"
    
    - name: Extract and restart on VPS
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          cd /var/www/pintu-frontend
          rm -rf .output
          tar -xzf output.tar.gz
          rm output.tar.gz
          pm2 restart pintu-frontend
          pm2 status
